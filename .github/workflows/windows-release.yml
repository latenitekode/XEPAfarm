name: Build and release Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Package executable and image assets
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --noupx
          --name ApexFarmer --add-data "ss:ss" --add-data "legends:legends"
          ApexFarmer.py
      - name: Verify packaged executable
        run: '& .\dist\ApexFarmer.exe --build-check'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ApexFarmer-windows-x64
          path: dist/ApexFarmer.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ApexFarmer-windows-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > release-assets.txt; then
            if ! grep -Fxq 'ApexFarmer.exe' release-assets.txt; then
              gh release upload "$RELEASE_TAG" release/ApexFarmer.exe
            fi
          else
            gh release create "$RELEASE_TAG" release/ApexFarmer.exe --verify-tag --generate-notes
          fi
